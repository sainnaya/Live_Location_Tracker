<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Live Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:20px;
}

h1{
margin-bottom:20px;
text-align:center;
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:20px;
}

.stats div{
background:white;
padding:15px 25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
font-weight:bold;
}

#search{
width:300px;
padding:10px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#0077ff;
color:white;
}

a{
text-decoration:none;
}

@media(max-width:768px){

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<h1>📍 Live Location Dashboard</h1>

<div class="stats">

<div>Total : <span id="total">0</span></div>

<div>Online : <span id="online">0</span></div>

<div>Offline : <span id="offline">0</span></div>

</div>

<input
type="text"
id="search"
placeholder="Search User...">

<br><br>

<table>

<thead>

<tr>

<th>User</th>
<th>Name</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Address</th>
<th>Speed</th>
<th>Accuracy</th>
<th>Status</th>
<th>Updated</th>
<th>Map</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket=io();

const tbody=document.getElementById("tbody");

const users={};

fetch("/targets")
.then(res=>res.json())
.then(data=>{

Object.assign(users,data);

render();

});

socket.on("location-update",(user)=>{

users[user.id]=user;

render();

});

setInterval(()=>{

fetch("/targets")

.then(res=>res.json())

.then(data=>{

Object.assign(users,data);

render();

});

},3000);

document
.getElementById("search")
.addEventListener("keyup",render);

function render(){

tbody.innerHTML="";

const search=document
.getElementById("search")
.value
.toLowerCase();

let online=0;

let offline=0;

for(const id in users){

const user=users[id];

if(!id.toLowerCase().includes(search))
continue;

if(user.status==="Online")
online++;
else
offline++;

tbody.innerHTML+=`

<tr>

<td>${id}</td>

<td>${user.name}</td>

<td>${Number(user.lat).toFixed(6)}</td>

<td>${Number(user.lng).toFixed(6)}</td>

<td>${user.address || "Loading..."}</td>

<td>${Number(user.speed || 0).toFixed(2)} km/h</td>

<td>${Number(user.accuracy || 0).toFixed(2)} m</td>

<td>${user.status=="Online" ? "🟢 Online":"🔴 Offline"}</td>

<td>${user.lastUpdated}</td>

<td>

<a href="/map?id=${id}">

📍 View

</a>

</td>

</tr>

`;

}

document.getElementById("total").innerHTML=Object.keys(users).length;

document.getElementById("online").innerHTML=online;

document.getElementById("offline").innerHTML=offline;

}

</script>

</body>

</html>
