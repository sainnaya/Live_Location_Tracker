<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#0077ff;
color:white;
padding:15px;
text-align:center;
}

header p{
margin-top:6px;
}

#map{
flex:1;
width:100%;
}

</style>

</head>

<body>

<header>

<h2>📍 Live Location Tracker</h2>

<p>User : <span id="userid"></span></p>

<p>📏 Distance : <span id="distance">0.00 km</span></p>

<p>🚗 Speed : <span id="speed">0.00 km/h</span></p>

</header>

<div id="map"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const id=new URLSearchParams(location.search).get("id");

document.getElementById("userid").innerHTML=id;

const socket=io();

const map=L.map("map").setView([20.5937,78.9629],5);

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:"© OpenStreetMap"

}

).addTo(map);

const marker=L.marker([20.5937,78.9629]).addTo(map);

const route=L.polyline([],{

color:"blue",

weight:5

}).addTo(map);

let totalDistance=0;

let previous=null;

fetch("/history/"+id)

.then(res=>res.json())

.then(history=>{

history.forEach(point=>{

const lat=Number(point.latitude);
const lng=Number(point.longitude);

route.addLatLng([lat,lng]);

if(previous){

totalDistance+=distance(

previous.lat,

previous.lng,

lat,

lng

);

}

previous={lat,lng};

});

if(history.length){

const last=history[history.length-1];

marker.setLatLng([last.latitude,last.longitude]);

map.fitBounds(route.getBounds());

document.getElementById("distance").innerHTML=

totalDistance.toFixed(2)+" km";

}

});

socket.on("location-update",(user)=>{

if(user.id!==id) return;

const lat=Number(user.lat);

const lng=Number(user.lng);

marker.setLatLng([lat,lng]);

route.addLatLng([lat,lng]);

if(previous){

totalDistance+=distance(

previous.lat,

previous.lng,

lat,

lng

);

}

previous={lat,lng};

document.getElementById("distance").innerHTML=

totalDistance.toFixed(2)+" km";

document.getElementById("speed").innerHTML=

Number(user.speed||0).toFixed(2)+" km/h";

marker.bindPopup(`

<b>User :</b> ${id}<br><br>

📍 ${user.address || "Address Loading..."}<br><br>

Latitude : ${lat}<br>

Longitude : ${lng}<br>

Speed : ${Number(user.speed||0).toFixed(2)} km/h<br>

Accuracy : ${Number(user.accuracy||0).toFixed(2)} m<br>

Status : ${user.status}<br>

Updated : ${user.lastUpdated}

`).openPopup();

map.setView([lat,lng],17);

});

function distance(lat1,lon1,lat2,lon2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;

const dLon=(lon2-lon1)*Math.PI/180;

const a=

Math.sin(dLat/2)**2+

Math.cos(lat1*Math.PI/180)*

Math.cos(lat2*Math.PI/180)*

Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

</script>

</body>

</html>
